plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fserrano.mandotv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fserrano.mandotv'
        minSdk 23
        targetSdk 34
        versionCode 8
        versionName '4.3'
    }

    signingConfigs {
        fija {
            // Firma fija: así cada versión se instala encima de la anterior
            storeFile rootProject.file('mandotv.jks')
            storePassword System.getenv('KEYSTORE_PASS') ?: ''
            keyAlias 'mandotv'
            keyPassword System.getenv('KEYSTORE_PASS') ?: ''
        }
    }

    buildTypes {
        debug {
            if (System.getenv('KEYSTORE_PASS')) signingConfig signingConfigs.fija
        }
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_PASS')) signingConfig signingConfigs.fija
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
