plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fserrano.mandotv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fserrano.mandotv'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
